<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Cyber Health Check – TRIBAMS</title>
    <meta name="description" content="Get your free cybersecurity health check. Answer 10 quick questions and receive a personalized security score with AI-powered recommendations.">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
               RESET & BASE – 0-200
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-card: rgba(255, 255, 255, 0.02);
            --bg-card-hover: rgba(255, 255, 255, 0.04);
            --border-color: rgba(0, 255, 136, 0.1);
            --border-color-hover: rgba(0, 255, 136, 0.2);
            --neon-green: #00ff88;
            --neon-blue: #0088ff;
            --neon-cyan: #00ccff;
            --neon-purple: #a855f7;
            --neon-orange: #f59e0b;
            --neon-pink: #ec4899;
            --neon-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
            --text-muted: #555;
            --text-light: #aabbdd;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --shadow-glow: 0 0 30px rgba(0, 255, 136, 0.1);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', 'Segoe UI', -apple-system, system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }

        a {
            color: var(--neon-green);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: var(--neon-cyan);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ============================================================
               HEADER & NAVIGATION – 200-400
               ============================================================ */
        header {
            background: rgba(10, 14, 39, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.8rem 0;
            transition: var(--transition);
        }

        header.scrolled {
            background: rgba(10, 14, 39, 0.98);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            stroke: var(--neon-green);
            fill: none;
            -webkit-text-fill-color: initial;
            flex-shrink: 0;
        }

        .logo:hover svg {
            stroke: var(--neon-cyan);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            position: relative;
            padding: 0.3rem 0;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a.active {
            color: var(--neon-green);
        }

        .btn-nav {
            padding: 0.4rem 1.4rem;
            background: linear-gradient(135deg, var(--neon-green), #00cc66);
            color: var(--bg-primary) !important;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            -webkit-text-fill-color: initial;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
            color: var(--bg-primary) !important;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .menu-toggle span {
            width: 26px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: var(--transition);
        }

        .menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ============================================================
               PAGE HEADER – 400-550
               ============================================================ */
        .page-header {
            padding: 2rem 0 1.5rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 900;
        }

        .page-header h1 .highlight {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 560px;
            margin: 0.3rem auto 0;
        }

        /* ============================================================
               PROGRESS BAR – 550-650
               ============================================================ */
        .progress-section {
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        .progress-section .progress-track {
            width: 100%;
            height: 6px;
            background: var(--glass-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-section .progress-track .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-section .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        /* ============================================================
               QUESTION CARD – 650-1000
               ============================================================ */
        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
            transition: var(--transition);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-card:hover {
            border-color: var(--border-color-hover);
        }

        .question-card .question-number {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .question-card .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .question-card .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .question-card .option {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .question-card .option:hover {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.03);
        }

        .question-card .option .radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .question-card .option .radio::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-green);
            transform: scale(0);
            transition: var(--transition);
        }

        .question-card .option.selected {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .question-card .option.selected .radio {
            border-color: var(--neon-green);
        }

        .question-card .option.selected .radio::after {
            transform: scale(1);
        }

        .question-card .option .label {
            font-size: 0.95rem;
        }

        .question-card .option .points {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .question-card .action-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .question-card .action-row .btn {
            padding: 0.6rem 1.8rem;
            font-size: 0.9rem;
        }

        .question-card .action-row .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ============================================================
               RESULTS – 1000-1250
               ============================================================ */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        .result-card .result-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .result-card .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .result-card .score-circle .inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        .result-card .score-circle .inner .number {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--neon-green);
            line-height: 1;
        }

        .result-card .score-circle .inner .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-card .grade {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        .result-card .grade.grade-excellent {
            color: var(--neon-green);
        }
        .result-card .grade.grade-good {
            color: var(--neon-orange);
        }
        .result-card .grade.grade-weak {
            color: var(--neon-pink);
        }
        .result-card .grade.grade-critical {
            color: var(--neon-red);
        }

        .result-card .result-message {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 500px;
            margin: 0.5rem auto 1.5rem;
            line-height: 1.7;
        }

        .result-card .recommendations {
            text-align: left;
            margin: 1.5rem 0;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 1.2rem 1.5rem;
        }

        .result-card .recommendations h4 {
            font-size: 0.9rem;
            color: var(--neon-green);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .result-card .recommendations ul {
            list-style: none;
            padding: 0;
        }

        .result-card .recommendations ul li {
            padding: 0.4rem 0;
            color: var(--text-light);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .result-card .recommendations ul li:last-child {
            border-bottom: none;
        }

        .result-card .recommendations ul li .bullet {
            color: var(--neon-green);
            font-weight: 700;
            flex-shrink: 0;
        }

        /* Email Capture */
        .result-card .email-capture {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: rgba(0, 255, 136, 0.03);
            border: 1px dashed rgba(0, 255, 136, 0.15);
            border-radius: var(--radius-sm);
        }

        .result-card .email-capture h4 {
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .result-card .email-capture p {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .result-card .email-capture .input-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .result-card .email-capture .input-group input {
            flex: 1;
            min-width: 180px;
            padding: 0.6rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: var(--font);
            transition: var(--transition);
        }

        .result-card .email-capture .input-group input:focus {
            outline: none;
            border-color: var(--neon-green);
        }

        .result-card .email-capture .input-group input::placeholder {
            color: var(--text-muted);
        }

        .result-card .email-capture .input-group .btn-capture {
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, var(--neon-orange), #d97706);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .result-card .email-capture .input-group .btn-capture:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
        }

        .result-card .email-capture .input-group .btn-capture:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .result-card .action-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1.5rem;
        }

        /* ============================================================
               BUTTONS – 1250-1320
               ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-green), #00cc66);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 255, 136, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--glass-bg);
            border-color: var(--neon-green);
            color: var(--text-primary);
        }

        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--neon-green);
            color: var(--bg-primary);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 255, 136, 0.3);
        }

        .btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn.loading .spinner {
            display: inline-block;
        }
        .btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
               TOAST – 1320-1380
               ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 9999;
            animation: toastSlideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            max-width: 440px;
            font-family: var(--font);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--neon-green), #00cc66);
            color: var(--bg-primary);
        }
        .toast.error {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }
        .toast.info {
            background: linear-gradient(135deg, var(--neon-blue), #0066cc);
            color: #fff;
        }
        .toast.warning {
            background: linear-gradient(135deg, var(--neon-orange), #d97706);
            color: #fff;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 0 0 0.5rem;
            transition: var(--transition);
        }

        .toast .toast-close:hover {
            opacity: 1;
        }

        @keyframes toastSlideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ============================================================
               RESPONSIVE – 1380-1500
               ============================================================ */
        @media (max-width: 768px) {
            .container {
                padding: 0 1.2rem;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                background: var(--bg-secondary);
                position: absolute;
                top: 60px;
                right: 1rem;
                min-width: 220px;
                border: 1px solid var(--glass-border);
                border-radius: var(--radius-sm);
                padding: 1.2rem;
                gap: 1rem;
                box-shadow: var(--shadow-xl);
            }
            .nav-links.show {
                display: flex;
            }
            .menu-toggle {
                display: flex;
            }

            .question-card {
                padding: 1.2rem;
            }

            .question-card .question-text {
                font-size: 1rem;
            }

            .question-card .option .label {
                font-size: 0.85rem;
            }

            .question-card .action-row {
                flex-direction: column;
            }

            .question-card .action-row .btn {
                width: 100%;
                justify-content: center;
            }

            .result-card {
                padding: 1.5rem;
            }

            .result-card .score-circle {
                width: 130px;
                height: 130px;
            }

            .result-card .score-circle .inner {
                width: 105px;
                height: 105px;
            }

            .result-card .score-circle .inner .number {
                font-size: 2.2rem;
            }

            .result-card .email-capture .input-group {
                flex-direction: column;
            }

            .result-card .email-capture .input-group input {
                min-width: 0;
            }

            .result-card .email-capture .input-group .btn-capture {
                width: 100%;
                justify-content: center;
            }

            .toast {
                left: 16px;
                right: 16px;
                transform: none;
                max-width: none;
                width: auto;
                bottom: 16px;
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            @keyframes toastSlideDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px) scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.6rem;
            }

            .question-card {
                padding: 1rem;
            }

            .question-card .option {
                padding: 0.5rem 0.8rem;
                gap: 0.5rem;
            }

            .question-card .option .radio {
                width: 16px;
                height: 16px;
            }

            .question-card .option .radio::after {
                width: 8px;
                height: 8px;
            }

            .question-card .option .points {
                display: none;
            }

            .result-card .score-circle {
                width: 110px;
                height: 110px;
            }

            .result-card .score-circle .inner {
                width: 88px;
                height: 88px;
            }

            .result-card .score-circle .inner .number {
                font-size: 1.8rem;
            }

            .result-card .recommendations {
                padding: 0.8rem 1rem;
            }

            .result-card .result-message {
                font-size: 0.9rem;
            }
        }

        /* ============================================================
               PRINT STYLES – 1500-1510
               ============================================================ */
        @media print {
            header,
            .toast,
            .menu-toggle,
            .action-row,
            .email-capture {
                display: none !important;
            }
            .question-card {
                border: 1px solid #333 !important;
                box-shadow: none !important;
            }
            .result-card {
                border: 1px solid #333 !important;
            }
            body {
                background: #fff;
                color: #000;
            }
            .page-header h1 .highlight {
                -webkit-text-fill-color: #000;
                background: none;
                color: #000;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header id="header">
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8v4"/>
                        <path d="M12 16h.01"/>
                    </svg>
                    TRIBAMS
                </a>
                <ul class="nav-links" id="navLinks">
                    <li><a href="/">Home</a></li>
                    <li><a href="/health-check" class="active">🛡️ Health Check</a></li>
                    <li><a href="/resource-center">Resource Center</a></li>
                    <li><a href="/login">Sign In</a></li>
                    <li><a href="/register" class="btn-nav">Get Started</a></li>
                </ul>
                <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <div class="container">

        <!-- Page Header -->
        <div class="page-header">
            <h1>🛡️ <span class="highlight">Free Cyber Health Check</span></h1>
            <p class="subtitle">Answer 10 quick questions and get your personalized security score with AI-powered recommendations in under 2 minutes.</p>
        </div>

        <!-- ============================================================
        QUIZ CONTAINER
        ============================================================ -->
        <div id="quizContainer">

            <!-- Progress -->
            <div class="progress-section">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-label">
                    <span id="progressLabel">Question 1 of 10</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>

            <!-- Question -->
            <div class="question-card" id="questionCard">
                <!-- Rendered by JavaScript -->
            </div>

        </div>

        <!-- ============================================================
        RESULTS CONTAINER
        ============================================================ -->
        <div id="resultsContainer" style="display:none;">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- Back to Home -->
        <div style="text-align:center; padding:2rem 0 3rem;">
            <a href="/" class="btn btn-secondary">← Back to Home</a>
        </div>

    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script>
        // ============================================================
        // QUESTIONS – 10 cybersecurity health check questions
        // ============================================================
        const QUESTIONS = [{
            id: 1,
            text: 'Do you use unique passwords for all your accounts?',
            options: [
                { value: 20, label: 'Yes, I use a password manager' },
                { value: 10, label: 'Mostly, but I reuse some' },
                { value: 5, label: 'I reuse the same password everywhere' },
                { value: 0, label: 'I use weak or default passwords' }
            ]
        }, {
            id: 2,
            text: 'Does your organisation enforce Multi‑Factor Authentication (MFA)?',
            options: [
                { value: 20, label: 'Yes, MFA is required for all accounts' },
                { value: 10, label: 'Only for critical accounts' },
                { value: 5, label: 'No, we do not use MFA' },
                { value: 0, label: 'I don\'t know what MFA is' }
            ]
        }, {
            id: 3,
            text: 'How often do you update your software and systems?',
            options: [
                { value: 20, label: 'Automatically, as soon as updates are available' },
                { value: 10, label: 'Within a week' },
                { value: 5, label: 'Only when I remember' },
                { value: 0, label: 'Never' }
            ]
        }, {
            id: 4,
            text: 'Does your organisation have a formal cybersecurity policy?',
            options: [
                { value: 20, label: 'Yes, and employees are trained regularly' },
                { value: 10, label: 'Yes, but it\'s outdated' },
                { value: 5, label: 'We have some informal guidelines' },
                { value: 0, label: 'No policy exists' }
            ]
        }, {
            id: 5,
            text: 'How often do you back up critical data?',
            options: [
                { value: 20, label: 'Daily, with off‑site backups' },
                { value: 10, label: 'Weekly' },
                { value: 5, label: 'Monthly' },
                { value: 0, label: 'Never' }
            ]
        }, {
            id: 6,
            text: 'What is your approach to suspicious emails?',
            options: [
                { value: 20, label: 'I report them to IT immediately' },
                { value: 10, label: 'I ignore and delete them' },
                { value: 5, label: 'I sometimes click on links to check' },
                { value: 0, label: 'I don\'t check for phishing' }
            ]
        }, {
            id: 7,
            text: 'Are your Wi‑Fi and network connections secure?',
            options: [
                { value: 20, label: 'Yes, WPA3 encryption and VPN for remote' },
                { value: 10, label: 'We use WPA2' },
                { value: 5, label: 'No password on guest network' },
                { value: 0, label: 'Open network, no encryption' }
            ]
        }, {
            id: 8,
            text: 'Do you monitor for unauthorised access or breaches?',
            options: [
                { value: 20, label: 'Yes, with SIEM tools' },
                { value: 10, label: 'Basic logs, but not actively monitored' },
                { value: 5, label: 'Rarely' },
                { value: 0, label: 'No monitoring at all' }
            ]
        }, {
            id: 9,
            text: 'How secure is your supply chain?',
            options: [
                { value: 20, label: 'We vet all vendors and require security compliance' },
                { value: 10, label: 'We have basic vendor checks' },
                { value: 5, label: 'We don\'t vet vendors' },
                { value: 0, label: 'We have no visibility into our supply chain' }
            ]
        }, {
            id: 10,
            text: 'Does your organisation have an incident response plan?',
            options: [
                { value: 20, label: 'Yes, tested and updated regularly' },
                { value: 10, label: 'We have a written plan but never tested' },
                { value: 5, label: 'We have verbal plans' },
                { value: 0, label: 'No plan exists' }
            ]
        }];

        // ============================================================
        // STATE
        // ============================================================
        let currentQuestion = 0;
        let answers = [];
        let quizCompleted = false;
        let score = 0;
        let totalPossible = 200;

        // ============================================================
        // DOM REFS
        // ============================================================
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const questionCard = document.getElementById('questionCard');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const progressPercent = document.getElementById('progressPercent');

        // ============================================================
        // HELPERS
        // ============================================================
        function showToast(message, type = 'success', duration = 3500) {
            const existing = document.querySelectorAll('.toast');
            existing.forEach(t => t.remove());

            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${icons[type] || 'ℹ️'} ${message}</span>
                <button class="toast-close" aria-label="Close notification">&times;</button>
            `;
            document.body.appendChild(toast);
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => toast.remove());
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-20px) scale(0.9)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        function getGrade(percentage) {
            if (percentage >= 80) return { text: 'Excellent', class: 'grade-excellent', icon: '🛡️' };
            if (percentage >= 60) return { text: 'Good', class: 'grade-good', icon: '⚡' };
            if (percentage >= 40) return { text: 'Weak', class: 'grade-weak', icon: '⚠️' };
            return { text: 'Critical', class: 'grade-critical', icon: '🚨' };
        }

        // ============================================================
        // RENDER QUESTION
        // ============================================================
        function renderQuestion() {
            const q = QUESTIONS[currentQuestion];
            const selected = answers[currentQuestion] !== undefined ? answers[currentQuestion] : null;

            const optionsHtml = q.options.map((opt, idx) => {
                const isSelected = selected === idx;
                return `
                    <div class="option ${isSelected ? 'selected' : ''}" data-index="${idx}" onclick="selectOption(${idx})">
                        <div class="radio"></div>
                        <span class="label">${opt.label}</span>
                        <span class="points">+${opt.value} pts</span>
                    </div>
                `;
            }).join('');

            const isLast = currentQuestion === QUESTIONS.length - 1;

            questionCard.innerHTML = `
                <div class="question-number">Question ${q.id} of ${QUESTIONS.length}</div>
                <div class="question-text">${q.text}</div>
                <div class="options-list">${optionsHtml}</div>
                <div class="action-row">
                    <button class="btn btn-secondary" id="prevBtn" ${currentQuestion === 0 ? 'disabled' : ''} onclick="prevQuestion()">
                        ← Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" ${selected === null ? 'disabled' : ''} onclick="nextQuestion()">
                        ${isLast ? 'See My Results 🚀' : 'Next →'}
                    </button>
                </div>
            `;

            // Update progress
            const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
            progressFill.style.width = progress + '%';
            progressPercent.textContent = Math.round(progress) + '%';
            progressLabel.textContent = `Question ${currentQuestion + 1} of ${QUESTIONS.length}`;
        }

        // ============================================================
        // NAVIGATION FUNCTIONS
        // ============================================================
        function selectOption(index) {
            answers[currentQuestion] = index;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (answers[currentQuestion] === undefined) {
                showToast('Please select an answer before continuing.', 'warning');
                return;
            }

            if (currentQuestion === QUESTIONS.length - 1) {
                calculateResults();
            } else {
                currentQuestion++;
                renderQuestion();
            }
        }

        // ============================================================
        // CALCULATE RESULTS
        // ============================================================
        function calculateResults() {
            let totalScore = 0;
            for (let i = 0; i < QUESTIONS.length; i++) {
                const selectedIdx = answers[i];
                if (selectedIdx !== undefined) {
                    totalScore += QUESTIONS[i].options[selectedIdx].value;
                }
            }

            const percentage = Math.round((totalScore / totalPossible) * 100);
            score = percentage;
            quizCompleted = true;

            // Hide quiz, show results
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            renderResults(percentage, totalScore);
        }

        // ============================================================
        // RENDER RESULTS
        // ============================================================
        function renderResults(percentage, totalScore) {
            const grade = getGrade(percentage);
            const angle = (percentage / 100) * 360;

            let recommendations = [];
            if (percentage >= 80) {
                recommendations = [
                    'Continue regular security training for your team',
                    'Consider advanced threat hunting to stay ahead',
                    'Keep your incident response plan updated'
                ];
            } else if (percentage >= 60) {
                recommendations = [
                    'Implement Multi‑Factor Authentication (MFA) everywhere',
                    'Start using a password manager',
                    'Review and update your backup strategy'
                ];
            } else if (percentage >= 40) {
                recommendations = [
                    'Immediately implement MFA for all critical accounts',
                    'Conduct a full security audit',
                    'Develop and test an incident response plan'
                ];
            } else {
                recommendations = [
                    'Hire or consult a cybersecurity professional',
                    'Implement basic security policies immediately',
                    'Start with TRIBAMS training to build awareness'
                ];
            }

            resultsContainer.innerHTML = `
                <div class="result-card">
                    <div class="result-icon">${grade.icon}</div>
                    <h2 style="color:var(--neon-green);margin-bottom:0.3rem;">Your Cyber Health Score</h2>
                    <div class="score-circle" style="background: conic-gradient(var(--neon-green) ${angle}deg, var(--glass-border) ${angle}deg);">
                        <div class="inner">
                            <div class="number">${percentage}%</div>
                            <div class="label">Score</div>
                        </div>
                    </div>
                    <div class="grade ${grade.class}">${grade.text} Posture</div>
                    <p class="result-message">
                        ${percentage >= 80 ? 'You have a strong cybersecurity posture! You are well protected against most threats.' :
                          percentage >= 60 ? 'You have a solid foundation, but there are gaps that need attention.' :
                          percentage >= 40 ? 'Your security posture has significant gaps. Action is needed to prevent breaches.' :
                          'Your security posture is at high risk. Immediate action is required!'}
                    </p>

                    <div class="recommendations">
                        <h4>📌 AI‑Powered Recommendations</h4>
                        <ul>
                            ${recommendations.map(rec => `<li><span class="bullet">→</span> ${rec}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="email-capture">
                        <h4>📧 Get Your Full Security Report</h4>
                        <p>Enter your email to get a detailed PDF report and exclusive cybersecurity tips.</p>
                        <form class="input-group" id="emailForm" onsubmit="captureLead(event)">
                            <input type="email" id="leadEmail" placeholder="Enter your email address" required>
                            <button type="submit" class="btn-capture" id="leadBtn">
                                <span class="btn-text">📥 Download Report</span>
                                <span class="spinner"></span>
                            </button>
                        </form>
                        <p style="font-size:0.6rem;color:var(--text-muted);margin-top:0.5rem;">
                            🔒 Your email is safe with us. Unsubscribe anytime.
                        </p>
                    </div>

                    <div class="action-row">
                        <a href="/register" class="btn btn-primary">🚀 Start Training Free</a>
                        <button class="btn btn-secondary" onclick="retakeQuiz()">🔄 Retake Health Check</button>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // CAPTURE LEAD
        // ============================================================
        async function captureLead(event) {
            event.preventDefault();
            const email = document.getElementById('leadEmail').value.trim();
            const btn = document.getElementById('leadBtn');

            if (!email || !email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/health-check-lead', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, score })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('✅ Thank you! Your report is being generated.', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    showToast('Error saving your email. Please try again.', 'error');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Lead capture error:', error);
                showToast('Network error. Please try again.', 'error');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ============================================================
        // RETAKE QUIZ
        // ============================================================
        function retakeQuiz() {
            currentQuestion = 0;
            answers = [];
            quizCompleted = false;
            score = 0;
            quizContainer.style.display = 'block';
            resultsContainer.style.display = 'none';
            renderQuestion();
            // Scroll to top
            document.querySelector('.page-header').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // HEADER SCROLL & MOBILE MENU
        // ============================================================
        const header = document.getElementById('header');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('navLinks').classList.toggle('show');
            this.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('show');
                document.getElementById('menuToggle').classList.remove('active');
            });
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Number keys 1-4 to select options
            if (e.key >= '1' && e.key <= '4') {
                const idx = parseInt(e.key) - 1;
                const options = document.querySelectorAll('.option');
                if (options[idx]) {
                    options[idx].click();
                }
            }
            // Arrow keys for navigation
            if (e.key === 'ArrowLeft') {
                document.getElementById('prevBtn')?.click();
            }
            if (e.key === 'ArrowRight') {
                document.getElementById('nextBtn')?.click();
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        renderQuestion();

        console.log('🛡️ Cyber Health Check loaded.');
    </script>

</body>
</html>
