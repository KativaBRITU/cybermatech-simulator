<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Cybermatech</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="auth-page">
    <div class="register-container">
        <h1>Cybermatech</h1>
        <p class="auth-sub">Create your training account</p>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <input type="password" id="password" placeholder="Password (min 8 characters)" required autocomplete="new-password" minlength="8">
            <button type="submit">Register</button>
        </form>
        <div id="message" class="error"></div>
        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();
            if (data.success) {
                messageDiv.className = 'success';
                messageDiv.textContent = data.message;
                setTimeout(() => { window.location.href = '/login'; }, 1500);
            } else {
                messageDiv.className = 'error';
                messageDiv.textContent = data.message;
            }
        });
    </script>
    <script src="/js/site-media.js" defer></script>
</body>
</html>
