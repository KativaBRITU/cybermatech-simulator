<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate — Cybermatech</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="certificate-page">
    <div class="certificate-wrapper">
        <div id="certificateContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your certificate...</p>
            </div>
        </div>
        <div class="button-group" id="buttons" style="display: none;">
            <button class="btn-download" onclick="saveAsPDF()">Save as PDF</button>
            <button class="btn-back" onclick="location.href='/dashboard'">Back to Dashboard</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let module = urlParams.get('module') || 'Cybersecurity Training';
        let score = urlParams.get('score') || '100';
        let username = urlParams.get('username') || 'Student';

        module = decodeURIComponent(module);
        username = decodeURIComponent(username);

        const verificationCode = 'CM-' + Math.random().toString(36).substring(2, 10).toUpperCase();

        function renderCertificate() {
            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const scoreNum = parseInt(score);

            let scoreMessage = '';
            if (scoreNum >= 90) {
                scoreMessage = 'Outstanding achievement — exceptional understanding of the module.';
            } else if (scoreNum >= 80) {
                scoreMessage = 'Excellent performance — strong grasp of the material.';
            } else if (scoreNum >= 70) {
                scoreMessage = 'Good work — successfully completed with solid understanding.';
            } else {
                scoreMessage = 'Certificate of completion — required training module finished.';
            }

            const certificateHTML = `
                <div class="certificate" id="certificate">
                    <h1>CYBERMATECH</h1>
                    <div class="certificate-subtitle">Cybersecurity Training Certificate</div>

                    <h3>This certificate is proudly presented to</h3>

                    <div class="recipient-name">${escapeHtml(username)}</div>

                    <h3>for successfully completing</h3>

                    <div class="module-name">${escapeHtml(module)}</div>

                    <div class="score-text">
                        with a score of <span class="score-highlight">${scoreNum}%</span>
                    </div>

                    <div class="score-text" style="font-size: 0.95rem; color: var(--muted); max-width: 500px; margin: 0.75rem auto 0;">
                        ${scoreMessage}
                    </div>

                    <div class="date">
                        <p>Awarded on: ${dateString}</p>
                    </div>

                    <div class="signature">
                        <div class="signature-line">
                            <div class="line"></div>
                            <p>Training Lead</p>
                            <p>Cybermatech</p>
                        </div>
                        <div class="signature-line">
                            <div class="line"></div>
                            <p>Program Director</p>
                            <p>Operations</p>
                        </div>
                    </div>

                    <div class="verification-code">
                        Verification Code: ${verificationCode}
                    </div>
                </div>
            `;

            document.getElementById('certificateContainer').innerHTML = certificateHTML;
            document.getElementById('buttons').style.display = 'flex';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function saveAsPDF() {
            const instructionMsg = document.createElement('div');
            instructionMsg.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1f6f63;color:#fff;padding:10px 20px;border-radius:8px;font-weight:700;z-index:9999;';
            instructionMsg.textContent = 'In the print dialog, choose Save as PDF';
            document.body.appendChild(instructionMsg);
            window.print();
            setTimeout(() => instructionMsg.remove(), 5000);
        }

        window.saveAsPDF = saveAsPDF;
        renderCertificate();
    </script>
</body>
</html>
