<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training - Cybermatech Cybersecurity Simulator</title>
        <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a class="logo" href="/">Cybermatech <span>Training</span></a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li data-auth="member"><a href="/dashboard">Dashboard</a></li>
                <li data-auth="member"><a href="/logout" class="logout">Logout</a></li>
                <li data-auth="guest"><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div id="quizApp">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your training module...</p>
            </div>
        </div>
    </div>

    <script>
        // Get module name from URL (e.g., /training/phishing -> 'phishing')
        const moduleName = window.location.pathname.split('/')[2] || 'phishing';
        
        // ============================================================
        // TRAINING MODULES WITH COMPLETE QUESTIONS
        // ============================================================
        
        const modules = {
            phishing: {
                title: '🛡️ Phishing Detection & Awareness',
                icon: '🎣',
                description: 'Learn to identify and prevent phishing attacks, one of the most common cyber threats.',
                questions: [
                    {
                        question: 'What is a common sign of a phishing email?',
                        options: [
                            'The email comes from a known sender',
                            'The email contains urgent language asking for immediate action',
                            'The email has perfect spelling and grammar',
                            'The email offers a legitimate discount'
                        ],
                        correct: 1,
                        explanation: 'Phishing emails often create a false sense of urgency to trick you into acting quickly without thinking.'
                    },
                    {
                        question: 'What should you do if you receive a suspicious email?',
                        options: [
                            'Click the link to see where it goes',
                            'Reply and ask for more information',
                            'Report it to your IT security team',
                            'Forward it to all your colleagues'
                        ],
                        correct: 2,
                        explanation: 'Always report suspicious emails to your security team. They have tools to analyze them safely.'
                    },
                    {
                        question: 'What is "spear phishing"?',
                        options: [
                            'A phishing attack targeting random people',
                            'A phishing attack targeting a specific individual or organization',
                            'A phishing attack sent via SMS',
                            'A phishing attack using phone calls'
                        ],
                        correct: 1,
                        explanation: 'Spear phishing is highly targeted, using personal information to appear legitimate to specific victims.'
                    },
                    {
                        question: 'What does HTTPS indicate in a website URL?',
                        options: [
                            'The website is completely safe and verified',
                            'The connection between your browser and the website is encrypted',
                            'The website cannot be hacked',
                            'The website is from a government organization'
                        ],
                        correct: 1,
                        explanation: 'HTTPS encrypts data between you and the website, but doesn\'t guarantee the website itself is legitimate.'
                    },
                    {
                        question: 'Which of these is a red flag in an email?',
                        options: [
                            'Generic greeting like "Dear Customer"',
                            'Your actual name in the greeting',
                            'A known company logo',
                            'Proper spelling and grammar'
                        ],
                        correct: 0,
                        explanation: 'Legitimate companies usually address you by name. Generic greetings are a common phishing tactic.'
                    },
                    {
                        question: 'What is "whaling" in cybersecurity?',
                        options: [
                            'A phishing attack targeting executives or high-profile individuals',
                            'A type of computer virus that spreads through email',
                            'A method of encrypting sensitive data',
                            'A network security protocol for wireless connections'
                        ],
                        correct: 0,
                        explanation: 'Whaling targets "big fish" like CEOs and CFOs to gain access to sensitive company information.'
                    },
                    {
                        question: 'What should you check before clicking a link in an email?',
                        options: [
                            'The sender\'s display name only',
                            'Hover over the link to see the actual URL',
                            'The email subject line only',
                            'The time the email was sent'
                        ],
                        correct: 1,
                        explanation: 'Hovering reveals the true destination URL. Fake links often look legitimate but point to malicious sites.'
                    },
                    {
                        question: 'What is domain spoofing?',
                        options: [
                            'Creating a website that looks identical to a legitimate one',
                            'Speeding up your internet connection',
                            'A type of antivirus software',
                            'A method to recover deleted emails'
                        ],
                        correct: 0,
                        explanation: 'Attackers create fake websites with similar domain names (e.g., amaz0n.com instead of amazon.com).'
                    }
                ]
            },
            
            malware: {
                title: '🐛 Malware Analysis & Protection',
                icon: '🦠',
                description: 'Understand different types of malware and how to protect against them.',
                questions: [
                    {
                        question: 'What type of malware locks your files and demands payment for release?',
                        options: ['Virus', 'Trojan', 'Ransomware', 'Spyware'],
                        correct: 2,
                        explanation: 'Ransomware encrypts your files and demands a ransom (usually cryptocurrency) for the decryption key.'
                    },
                    {
                        question: 'What is a "Trojan Horse" in cybersecurity?',
                        options: [
                            'A virus that spreads rapidly through email',
                            'A worm that self-replicates across networks',
                            'Malware disguised as legitimate software',
                            'A type of hardware firewall device'
                        ],
                        correct: 2,
                        explanation: 'Trojans trick users by appearing as legitimate software while carrying malicious payloads.'
                    },
                    {
                        question: 'Which of these is a common way malware spreads?',
                        options: ['Email attachments', 'Software downloads', 'USB drives', 'All of the above'],
                        correct: 3,
                        explanation: 'Malware can spread through multiple vectors. Always be cautious with any external files or devices.'
                    },
                    {
                        question: 'What does a keylogger do?',
                        options: [
                            'Logs and records every keystroke you make',
                            'Deletes all your files permanently',
                            'Encrypts your data for ransom',
                            'Slows down your computer performance'
                        ],
                        correct: 0,
                        explanation: 'Keyloggers capture passwords, credit card numbers, and sensitive information typed on your keyboard.'
                    },
                    {
                        question: 'What is a computer worm?',
                        options: [
                            'Malware that requires user interaction to spread',
                            'Malware that self-replicates across networks without user interaction',
                            'A type of antivirus software',
                            'A hardware security device'
                        ],
                        correct: 1,
                        explanation: 'Worms spread automatically across networks, causing damage without any user action.'
                    },
                    {
                        question: 'What is a "zero-day" vulnerability?',
                        options: [
                            'A vulnerability that has existed for zero days (just discovered)',
                            'A vulnerability that only works at midnight',
                            'A vulnerability that affects only old software',
                            'A vulnerability that cannot be exploited'
                        ],
                        correct: 0,
                        explanation: 'Zero-day vulnerabilities are unknown to software vendors, giving zero days to prepare a fix.'
                    },
                    {
                        question: 'Which of these is a sign of malware infection?',
                        options: [
                            'Computer running very slowly',
                            'Unexpected pop-up windows',
                            'Files being encrypted or deleted',
                            'All of the above'
                        ],
                        correct: 3,
                        explanation: 'Multiple symptoms can indicate infection. Run regular antivirus scans if you notice these signs.'
                    },
                    {
                        question: 'What is a botnet?',
                        options: [
                            'A network of compromised computers controlled by an attacker',
                            'A type of antivirus software',
                            'A robot used for physical security',
                            'A network security protocol'
                        ],
                        correct: 0,
                        explanation: 'Botnets are used for DDoS attacks, spam distribution, and other malicious activities.'
                    }
                ]
            },
            
            network: {
                title: '🔒 Network Security Fundamentals',
                icon: '🌐',
                description: 'Master the fundamentals of securing computer networks.',
                questions: [
                    {
                        question: 'What does a firewall do?',
                        options: [
                            'Speeds up your internet connection',
                            'Blocks unauthorized network traffic based on rules',
                            'Encrypts all data on your computer',
                            'Creates automatic backups of your files'
                        ],
                        correct: 1,
                        explanation: 'Firewalls act as gatekeepers, allowing or blocking traffic based on predefined security rules.'
                    },
                    {
                        question: 'What is a VPN (Virtual Private Network) used for?',
                        options: [
                            'To make your computer run faster',
                            'To securely connect to a private network over the internet',
                            'To block all online advertisements',
                            'To clean your hard drive of temporary files'
                        ],
                        correct: 1,
                        explanation: 'VPNs create encrypted tunnels, protecting your data from interception on public networks.'
                    },
                    {
                        question: 'What is a DDoS attack?',
                        options: [
                            'A virus that deletes system files',
                            'Overwhelming a server with traffic to make it unavailable',
                            'Stealing passwords through fake websites',
                            'Encrypting data and demanding a ransom'
                        ],
                        correct: 1,
                        explanation: 'DDoS attacks flood targets with traffic, exhausting resources and causing service outages.'
                    },
                    {
                        question: 'What does WPA stand for in WiFi security?',
                        options: [
                            'Wireless Protected Access',
                            'Wired Privacy Authentication',
                            'Web Protection Algorithm',
                            'WiFi Personal Access'
                        ],
                        correct: 0,
                        explanation: 'WPA is the standard for securing wireless networks. Always use WPA2 or WPA3 for security.'
                    },
                    {
                        question: 'Which port does HTTPS use by default?',
                        options: ['80 (HTTP)', '443 (HTTPS)', '8080 (Proxy)', '22 (SSH)'],
                        correct: 1,
                        explanation: 'HTTPS uses port 443. HTTP uses port 80. Secure websites should use HTTPS on port 443.'
                    },
                    {
                        question: 'What is a MAC address?',
                        options: [
                            'A unique identifier for network devices',
                            'An Apple computer model',
                            'A type of encryption algorithm',
                            'A network protocol for email'
                        ],
                        correct: 0,
                        explanation: 'MAC addresses are factory-assigned unique identifiers for every network interface card.'
                    },
                    {
                        question: 'What is DNS (Domain Name System)?',
                        options: [
                            'A security protocol for websites',
                            'The system that translates domain names to IP addresses',
                            'A type of firewall rule',
                            'A virus scanning technique'
                        ],
                        correct: 1,
                        explanation: 'DNS is like the phonebook of the internet, converting human-readable names to IP addresses.'
                    },
                    {
                        question: 'What is the "principle of least privilege"?',
                        options: [
                            'Giving users only the minimum access needed to do their job',
                            'Making all passwords as short as possible',
                            'Using the least expensive security solutions',
                            'Having minimal security to maximize convenience'
                        ],
                        correct: 0,
                        explanation: 'This principle limits damage by restricting unnecessary access. Users get only what they need.'
                    }
                ]
            }
        };
        
        // Get the selected module or default to phishing
        const currentModule = modules[moduleName] || modules.phishing;
        
        // Quiz state variables
        let currentQuestionIndex = 0;
        let userScore = 0;
        let userAnswers = []; // Stores selected answer indices
        let quizCompleted = false;
        let username = '';
        
        // Try to get username from session or URL
        async function fetchUsername() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                if (data.success && data.username) {
                    username = data.username;
                }
            } catch (e) {
                username = 'Student';
            }
        }
        
        // Save score to server
        async function saveScoreToServer(finalScore) {
            try {
                const response = await fetch('/api/save-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        module_name: moduleName, 
                        score: finalScore 
                    })
                });
                return await response.json();
            } catch (error) {
                console.log('Score saved locally only (server not accessible)');
                return { success: true };
            }
        }
        
        // Render the current question
        function renderQuestion() {
            const question = currentModule.questions[currentQuestionIndex];
            const isAnswered = userAnswers[currentQuestionIndex] !== undefined;
            
            const app = document.getElementById('quizApp');
            
            app.innerHTML = `
                <div class="quiz-container">
                    <div class="question-header">
                        <div class="module-badge">${currentModule.icon} ${currentModule.title}</div>
                        <div class="question-counter">Question ${currentQuestionIndex + 1} of ${currentModule.questions.length}</div>
                    </div>
                    <div class="question-text">
                        ${question.question}
                    </div>
                    <div class="options-list">
                        ${question.options.map((opt, idx) => `
                            <div class="option ${userAnswers[currentQuestionIndex] === idx ? 'selected' : ''}" data-index="${idx}">
                                <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                                <div class="option-text">${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="button-group">
                        <button class="btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled style="opacity:0.5"' : ''}>
                            ← Previous
                        </button>
                        <button onclick="nextQuestion()">
                            ${currentQuestionIndex === currentModule.questions.length - 1 ? 'Finish Quiz' : 'Next Question →'}
                        </button>
                    </div>
                </div>
            `;
            
            // Add click handlers to options
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const selectedIdx = parseInt(opt.dataset.index);
                    selectAnswer(selectedIdx);
                });
            });
        }
        
        function selectAnswer(answerIndex) {
            userAnswers[currentQuestionIndex] = answerIndex;
            renderQuestion(); // Re-render to show selected state
        }
        
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }
        
        function nextQuestion() {
            // Check if answered
            if (userAnswers[currentQuestionIndex] === undefined) {
                alert('Please select an answer before continuing.');
                return;
            }
            
            // Check if answer is correct and add to score
            const currentQuestion = currentModule.questions[currentQuestionIndex];
            if (userAnswers[currentQuestionIndex] === currentQuestion.correct) {
                // Score is calculated fresh in final calculation
            }
            
            if (currentQuestionIndex === currentModule.questions.length - 1) {
                // Quiz completed - calculate final score
                calculateAndShowResults();
            } else {
                currentQuestionIndex++;
                renderQuestion();
            }
        }
        
        function calculateAndShowResults() {
            // Calculate score
            let correctCount = 0;
            for (let i = 0; i < currentModule.questions.length; i++) {
                if (userAnswers[i] === currentModule.questions[i].correct) {
                    correctCount++;
                }
            }
            
            const finalScore = Math.round((correctCount / currentModule.questions.length) * 100);
            userScore = finalScore;
            
            // Save score to server
            saveScoreToServer(finalScore);
            
            // Show results
            showResults(correctCount, finalScore);
        }
        
        function showResults(correctCount, finalScore) {
            quizCompleted = true;
            
            let message = '';
            let messageClass = '';
            let certificateOption = '';
            
            if (finalScore >= 80) {
                message = '🎉 EXCELLENT! You have demonstrated expert-level knowledge in this module!';
                messageClass = 'success';
                certificateOption = `<button class="certificate-btn" onclick="generateCertificate()">🎓 Download Your Certificate</button>`;
            } else if (finalScore >= 60) {
                message = '👍 GOOD JOB! You have a solid understanding. Review the questions you missed to improve further.';
                messageClass = 'warning';
                certificateOption = '';
            } else {
                message = '📚 KEEP STUDYING! Review the material and try again. You can do this!';
                messageClass = 'error';
                certificateOption = '';
            }
            
            const app = document.getElementById('quizApp');
            
            // Create score circle style
            const scorePercent = finalScore;
            const angle = (scorePercent / 100) * 360;
            
            app.innerHTML = `
                <div class="quiz-container result-container">
                    <h1>${quizCompleted ? '🏆 Quiz Complete! 🏆' : 'Your Results'}</h1>
                    
                    <div class="score-circle" style="background: conic-gradient(#1f6f63 ${angle}deg, #d5dee5 ${angle}deg)">
                        <div class="score-inner">
                            <div class="score-number">${finalScore}%</div>
                            <div class="score-label">Score</div>
                        </div>
                    </div>
                    
                    <p style="font-size: 1.2rem;">You answered <strong>${correctCount}</strong> out of <strong>${currentModule.questions.length}</strong> correctly.</p>
                    
                    <div class="result-message ${messageClass}">
                        ${message}
                    </div>
                    
                    <div class="button-group" style="justify-content: center; flex-wrap: wrap;">
                        <button onclick="location.href='/dashboard'">📊 Go to Dashboard</button>
                        <button class="btn-secondary" onclick="restartQuiz()">🔄 Retake This Quiz</button>
                        ${certificateOption}
                    </div>
                </div>
            `;
        }
        
        function restartQuiz() {
            currentQuestionIndex = 0;
            userScore = 0;
            userAnswers = [];
            quizCompleted = false;
            renderQuestion();
        }
        
        function generateCertificate() {
            // Get username from the page or fetch it
            const userName = username || 'Student';
            const encodedName = encodeURIComponent(userName);
            const encodedModule = encodeURIComponent(currentModule.title);
            const encodedScore = userScore;
            
            window.location.href = `/certificate?module=${encodedModule}&score=${encodedScore}&username=${encodedName}`;
        }
        
        // Function to get user info
        async function getUserInfo() {
            try {
                const response = await fetch('/api/user-info');
                if (response.ok) {
                    const data = await response.json();
                    if (data.username) {
                        username = data.username;
                    }
                }
            } catch (e) {
                username = 'Cybersecurity Student';
            }
        }
        
        // Add API endpoint for user info (update server.js if needed)
        async function init() {
            await getUserInfo();
            renderQuestion();
        }
        
        // Start the quiz
        init();
        
        // Also make functions globally available
        window.previousQuestion = previousQuestion;
        window.nextQuestion = nextQuestion;
        window.restartQuiz = restartQuiz;
        window.generateCertificate = generateCertificate;
        window.selectAnswer = selectAnswer;
    </script>
    <script src="/js/auth-nav.js" defer></script>
</body>
</html>
