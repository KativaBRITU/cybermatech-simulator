<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training — Cybermatech</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a class="logo" href="/">Cybermatech <span>Training</span></a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li data-auth="member"><a href="/resources">Resources</a></li>
                <li data-auth="member"><a href="/dashboard">Dashboard</a></li>
                <li data-auth="member"><a href="/logout" class="logout">Logout</a></li>
                <li data-auth="guest"><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div id="moduleMediaSlot" hidden></div>
        <div id="quizApp">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your training module...</p>
            </div>
        </div>
    </div>

    <script>
        const moduleName = window.location.pathname.split('/')[2] || 'phishing';
        let quiz = null;
        let quizToken = null;
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let username = '';

        const app = () => document.getElementById('quizApp');

        async function loadQuiz() {
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleName)}/quiz`, {
                credentials: 'same-origin'
            });
            if (res.status === 401) {
                window.location.href = '/login?next=' + encodeURIComponent(location.pathname);
                return;
            }
            const data = await res.json();
            if (!data.success || !data.quiz) {
                app().innerHTML = `<div class="quiz-container"><p>Module not found. <a href="/dashboard">Back to dashboard</a></p></div>`;
                return;
            }
            quiz = data.quiz;
            quizToken = data.quizToken;
            if (window.CybermatechMedia) window.CybermatechMedia.applyModuleMedia(quiz);
            renderQuestion();
        }

        function renderQuestion() {
            const question = quiz.questions[currentQuestionIndex];
            app().innerHTML = `
                <div class="quiz-container">
                    <div class="question-header">
                        <div class="module-badge">${quiz.icon || ''} ${quiz.title}</div>
                        <div class="question-counter">Question ${currentQuestionIndex + 1} of ${quiz.questions.length}</div>
                    </div>
                    <p class="auth-sub" style="text-align:left;margin:0 0 1rem;">${quiz.description || ''}</p>
                    <div class="question-text">${question.question}</div>
                    <div class="options-list">
                        ${question.options.map((opt, idx) => `
                            <div class="option ${userAnswers[currentQuestionIndex] === idx ? 'selected' : ''}" data-index="${idx}">
                                <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                                <div class="option-text">${opt}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="button-group">
                        <button class="btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled style="opacity:0.5"' : ''}>← Previous</button>
                        <button onclick="nextQuestion()">
                            ${currentQuestionIndex === quiz.questions.length - 1 ? 'Submit drill' : 'Next question →'}
                        </button>
                    </div>
                </div>
            `;
            document.querySelectorAll('.option').forEach((opt) => {
                opt.addEventListener('click', () => {
                    userAnswers[currentQuestionIndex] = parseInt(opt.dataset.index, 10);
                    renderQuestion();
                });
            });
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        async function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === undefined) {
                alert('Select an answer before continuing.');
                return;
            }
            if (currentQuestionIndex === quiz.questions.length - 1) {
                await submitQuiz();
            } else {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        async function submitQuiz() {
            app().innerHTML = `<div class="loading"><div class="spinner"></div><p>Scoring on server...</p></div>`;
            const res = await fetch(`/api/modules/${encodeURIComponent(moduleName)}/submit`, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers: userAnswers, quizToken })
            });
            const data = await res.json();
            if (!data.success) {
                app().innerHTML = `<div class="quiz-container"><p>${data.message || 'Submit failed'}</p><button onclick="location.reload()">Reload module</button></div>`;
                return;
            }
            showResults(data);
        }

        function showResults(data) {
            const angle = (data.score / 100) * 360;
            let message = 'Keep studying and retry this module.';
            let certificateOption = '';
            if (data.certificate_eligible) {
                message = 'Excellent — you earned a certificate for this module.';
                certificateOption = `<button class="certificate-btn" onclick="generateCertificate(${data.score})">Download certificate</button>`;
            } else if (data.passed) {
                message = 'Passed. Review missed items, then push for certificate score (' + (quiz.certificate_score || 80) + '%+).';
            }

            const reviewHtml = (data.review || []).map((r, i) => `
                <div class="feature-block" style="margin-top:0.75rem;">
                    <strong>Q${i + 1}:</strong> ${r.is_correct ? 'Correct' : 'Incorrect'}
                    ${r.explanation ? `<div style="color:var(--muted);font-size:0.92rem;margin-top:0.25rem;">${r.explanation}</div>` : ''}
                </div>
            `).join('');

            app().innerHTML = `
                <div class="quiz-container result-container">
                    <h1>Drill complete</h1>
                    <div class="score-circle" style="background: conic-gradient(#1f6f63 ${angle}deg, #d5dee5 ${angle}deg)">
                        <div class="score-inner">
                            <div class="score-number">${data.score}%</div>
                            <div class="score-label">Score</div>
                        </div>
                    </div>
                    <p>You answered <strong>${data.correct}</strong> of <strong>${data.total}</strong> correctly.</p>
                    <div class="result-message">${message}</div>
                    <div class="button-group" style="justify-content:center;flex-wrap:wrap;">
                        <button onclick="location.href='/dashboard'">Go to dashboard</button>
                        <button class="btn-secondary" onclick="location.reload()">Retake</button>
                        ${certificateOption}
                    </div>
                    <h2 style="margin-top:2rem;text-align:left;">Review</h2>
                    <div style="text-align:left">${reviewHtml}</div>
                </div>
            `;
        }

        function generateCertificate(score) {
            const name = encodeURIComponent(username || 'Student');
            const mod = encodeURIComponent(quiz.title);
            window.location.href = `/certificate?module=${mod}&score=${score}&username=${name}`;
        }

        async function init() {
            try {
                const info = await fetch('/api/user-info', { credentials: 'same-origin' }).then((r) => r.json());
                if (info.success) username = info.username || '';
            } catch (_) {}
            await loadQuiz();
        }

        window.previousQuestion = previousQuestion;
        window.nextQuestion = nextQuestion;
        window.generateCertificate = generateCertificate;
        init();
    </script>
    <script src="/js/auth-nav.js" defer></script>
    <script src="/js/site-media.js" defer></script>
</body>
</html>
