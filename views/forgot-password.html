<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password — TRIBAMS</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        .reset-box {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border: 1px solid rgba(20, 184, 166, 0.45);
            background: rgba(15, 118, 110, 0.08);
            border-radius: 10px;
            text-align: left;
        }
        .reset-box a {
            word-break: break-all;
            color: #0f766e;
            font-weight: 600;
        }
    </style>
</head>
<body class="auth-page">
    <div class="login-container">
        <h1>Forgot password</h1>
        <p class="auth-sub">Enter your account email. We’ll send a reset link.</p>
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <button type="submit">Send reset link</button>
        </form>
        <div id="message" class="error"></div>
        <div class="register-link">
            <a href="/login">Back to login</a>
        </div>
    </div>
    <script>
        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'success';
            messageDiv.textContent = 'Sending…';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                messageDiv.className = data.success ? 'success' : 'error';
                const link = data.reset_link || data.dev_reset_link;
                let html = escapeHtml(data.message || (data.success ? 'Check your email.' : 'Request failed'));
                if (link) {
                    html += `<div class="reset-box"><strong>Open this reset link:</strong><br><a href="${escapeHtml(link)}">${escapeHtml(link)}</a></div>`;
                }
                messageDiv.innerHTML = html;
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Could not reach the server. Is it running on port 3080?';
            }
        });
    </script>
    <script src="/js/site-media.js" defer></script>
</body>
</html>
