<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – TRIBAMS</title>
    <meta name="description" content="Reset your TRIBAMS account password. Enter your email address and we'll send you a secure link to create a new password.">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
               RESET & BASE – 0-200
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-card: rgba(255, 255, 255, 0.02);
            --bg-card-hover: rgba(255, 255, 255, 0.04);
            --border-color: rgba(0, 255, 136, 0.1);
            --border-color-hover: rgba(0, 255, 136, 0.2);
            --neon-green: #00ff88;
            --neon-blue: #0088ff;
            --neon-cyan: #00ccff;
            --neon-purple: #a855f7;
            --neon-orange: #f59e0b;
            --neon-pink: #ec4899;
            --neon-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #8899bb;
            --text-muted: #555;
            --text-light: #aabbdd;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --shadow-glow: 0 0 30px rgba(0, 255, 136, 0.1);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', 'Segoe UI', -apple-system, system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 30%, rgba(0, 255, 136, 0.02) 0%, transparent 70%);
            min-height: 100vh;
        }

        a {
            color: var(--neon-green);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: var(--neon-cyan);
        }

        /* ============================================================
               CONTAINER – 200-400
               ============================================================ */
        .reset-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            transition: var(--transition);
        }

        .reset-card:hover {
            border-color: var(--border-color-hover);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.15);
            margin-bottom: 0.5rem;
        }

        .logo .logo-icon svg {
            width: 32px;
            height: 32px;
            stroke: #fff;
            fill: none;
        }

        .logo .logo-text {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo .logo-sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: block;
            margin-top: -0.2rem;
        }

        /* Card header */
        .card-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 340px;
            margin: 0 auto;
        }

        /* ============================================================
               FORM – 400-650
               ============================================================ */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .form-group label .required {
            color: var(--neon-red);
            margin-left: 0.2rem;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper .icon-left {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-group .input-wrapper .icon-left svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: var(--font);
            transition: var(--transition);
        }

        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }

        .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .form-group .input-wrapper input.error {
            border-color: var(--neon-red);
        }

        .form-group .input-wrapper input.valid {
            border-color: var(--neon-green);
        }

        .form-group .error-message {
            color: var(--neon-red);
            font-size: 0.75rem;
            margin-top: 0.2rem;
            display: none;
        }

        .form-group .error-message.show {
            display: block;
        }

        .form-group .help-text {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* Submit Button */
        .btn-reset {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--neon-green), #00cc66);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 255, 136, 0.25);
        }

        .btn-reset:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-reset .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-reset.loading .spinner {
            display: inline-block;
        }
        .btn-reset.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
               MESSAGE BOX – 650-750
               ============================================================ */
        .message-box {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            display: none;
            animation: resultFadeIn 0.4s ease;
        }

        @keyframes resultFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-box.success {
            display: block;
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.15);
            color: var(--neon-green);
        }

        .message-box.success .msg-icon {
            font-size: 1.2rem;
            margin-right: 0.4rem;
        }

        .message-box.success .msg-title {
            font-weight: 600;
        }

        .message-box.success .msg-detail {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }

        .message-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: var(--neon-red);
        }

        /* ============================================================
               FOOTER LINKS – 750-800
               ============================================================ */
        .auth-footer {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            font-weight: 500;
        }

        .auth-footer .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
        }

        /* ============================================================
               TOAST – 800-860
               ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 9999;
            animation: toastSlideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            max-width: 440px;
            font-family: var(--font);
        }

        .toast.success {
            background: linear-gradient(135deg, var(--neon-green), #00cc66);
            color: var(--bg-primary);
        }
        .toast.error {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }
        .toast.info {
            background: linear-gradient(135deg, var(--neon-blue), #0066cc);
            color: #fff;
        }
        .toast.warning {
            background: linear-gradient(135deg, var(--neon-orange), #d97706);
            color: #fff;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 0 0 0.5rem;
            transition: var(--transition);
        }

        .toast .toast-close:hover {
            opacity: 1;
        }

        @keyframes toastSlideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ============================================================
               RESPONSIVE – 860-940
               ============================================================ */
        @media (max-width: 480px) {
            .reset-card {
                padding: 1.5rem;
            }

            .logo .logo-icon {
                width: 44px;
                height: 44px;
            }
            .logo .logo-icon svg {
                width: 24px;
                height: 24px;
            }
            .logo .logo-text {
                font-size: 1.3rem;
            }

            .card-header h1 {
                font-size: 1.3rem;
            }

            .card-header p {
                font-size: 0.85rem;
            }

            .toast {
                left: 16px;
                right: 16px;
                transform: none;
                max-width: none;
                width: auto;
                bottom: 16px;
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            @keyframes toastSlideDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px) scale(0.9);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
        }

        /* ============================================================
               PRINT STYLES – 940-950
               ============================================================ */
        @media print {
            .reset-card {
                border: 1px solid #333 !important;
                box-shadow: none !important;
                background: #fff !important;
                color: #000 !important;
            }
            body {
                background: #fff !important;
            }
            .btn-reset, .toast {
                display: none !important;
            }
            .logo .logo-text {
                -webkit-text-fill-color: #000 !important;
                background: none !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    RESET CONTAINER
    ============================================================ -->
    <div class="reset-container">
        <div class="reset-card">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8v4"/>
                        <path d="M12 16h.01"/>
                    </svg>
                </div>
                <span class="logo-text">TRIBAMS</span>
                <span class="logo-sub">EST. 2025</span>
            </div>

            <!-- Card Header -->
            <div class="card-header">
                <h1>🔐 Reset Password</h1>
                <p>Enter your email address and we'll send you a secure link to create a new password.</p>
            </div>

            <!-- Reset Form -->
            <form id="resetForm" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
                            </svg>
                        </span>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <div class="error-message" id="emailError">Please enter a valid email address.</div>
                    <div class="help-text">
                        <span>🔒</span> We'll send a reset link to this email
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-reset" id="resetBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Message Box -->
            <div id="messageBox" class="message-box">
                <div class="msg-icon">✅</div>
                <div class="msg-title">Reset Link Sent</div>
                <div class="msg-detail">Check your email for the password reset link.</div>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <a href="/login" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                    Back to Sign In
                </a>
            </div>

        </div>
    </div>

    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script>
        // ============================================================
        // DOM REFS
        // ============================================================
        const form = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');

        // ============================================================
        // HELPERS
        // ============================================================
        function showToast(message, type = 'success', duration = 3500) {
            const existing = document.querySelectorAll('.toast');
            existing.forEach(t => t.remove());

            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${icons[type] || 'ℹ️'} ${message}</span>
                <button class="toast-close" aria-label="Close notification">&times;</button>
            `;
            document.body.appendChild(toast);
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => toast.remove());
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-20px) scale(0.9)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showMessage(type, title, detail) {
            messageBox.className = `message-box ${type}`;
            if (type === 'success') {
                messageBox.innerHTML = `
                    <div class="msg-icon">✅</div>
                    <div class="msg-title">${title}</div>
                    <div class="msg-detail">${detail}</div>
                `;
            } else if (type === 'error') {
                messageBox.innerHTML = `
                    <div style="display:flex;align-items:center;gap:0.4rem;">
                        <span style="font-size:1.1rem;">❌</span>
                        <span>${detail}</span>
                    </div>
                `;
            }
        }

        function hideMessage() {
            messageBox.className = 'message-box';
        }

        // ============================================================
        // REAL-TIME VALIDATION
        // ============================================================
        emailInput.addEventListener('input', function() {
            const val = this.value.trim();
            if (val.length > 0 && !validateEmail(val)) {
                emailError.classList.add('show');
                this.classList.add('error');
                this.classList.remove('valid');
            } else if (validateEmail(val)) {
                emailError.classList.remove('show');
                this.classList.remove('error');
                this.classList.add('valid');
            } else {
                emailError.classList.remove('show');
                this.classList.remove('error');
                this.classList.remove('valid');
            }
            hideMessage();
        });

        // ============================================================
        // FORM SUBMISSION
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();

            // Validate
            if (!validateEmail(email)) {
                emailError.classList.add('show');
                emailInput.classList.add('error');
                showToast('Please enter a valid email address.', 'error');
                return;
            }

            // Show loading
            resetBtn.classList.add('loading');
            resetBtn.disabled = true;
            hideMessage();

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                resetBtn.classList.remove('loading');
                resetBtn.disabled = false;

                if (data.success) {
                    if (data.reset_link) {
                        showMessage('success',
                            'Reset Link Ready',
                            'Email delivery is blocked on this machine (SMTP timeout). Use this one-time link to reset your password:<br><br><a href="' +
                            data.reset_link +
                            '" style="color:#0f766e;word-break:break-all;">' +
                            data.reset_link +
                            '</a>'
                        );
                        showToast('Reset link shown (email SMTP unavailable)', 'info');
                    } else {
                        showMessage('success',
                            'Reset Link Sent',
                            'If an account exists with this email, you will receive a password reset link shortly. Please check your inbox and spam folder.'
                        );
                        showToast(data.email_sent === false
                            ? 'Request saved — check server log if mail is delayed'
                            : '✅ Reset link sent successfully!',
                            data.email_sent === false ? 'info' : 'success'
                        );
                    }
                    emailInput.value = '';
                    emailInput.classList.remove('valid', 'error');
                    emailError.classList.remove('show');
                } else {
                    showMessage('error', '', data.message || 'Something went wrong. Please try again.');
                    showToast('❌ ' + (data.message || 'Something went wrong.'), 'error');
                }
            } catch (error) {
                console.error('Password reset error:', error);
                resetBtn.classList.remove('loading');
                resetBtn.disabled = false;
                showMessage('error', '', 'Network error. Please check your connection and try again.');
                showToast('❌ Network error. Please try again.', 'error');
            }
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Ctrl+K or Cmd+K to focus email
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                emailInput.focus();
            }
        });

        console.log('🔐 Forgot password page loaded.');
    </script>

</body>
</html>
