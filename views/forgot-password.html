<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password — Cybermatech</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="auth-page">
    <div class="login-container">
        <h1>Forgot password</h1>
        <p class="auth-sub">Enter your account email. We’ll send a reset link.</p>
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <button type="submit">Send reset link</button>
        </form>
        <div id="message" class="error"></div>
        <div class="register-link">
            <a href="/login">Back to login</a>
        </div>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'success';
            messageDiv.textContent = 'Sending…';

            const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            messageDiv.className = data.success ? 'success' : 'error';
            messageDiv.textContent = data.message || (data.success ? 'Check your email.' : 'Request failed');
            if (data.dev_reset_link) {
                messageDiv.innerHTML += `<div style="margin-top:0.75rem;font-size:0.85rem;word-break:break-all;">Dev link: <a href="${data.dev_reset_link}">${data.dev_reset_link}</a></div>`;
            }
        });
    </script>
    <script src="/js/site-media.js" defer></script>
</body>
</html>
