<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Cybermatech</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="auth-page">
    <div class="login-container">
        <h1>Set new password</h1>
        <p class="auth-sub">Choose a new password for your account.</p>
        <form id="resetForm">
            <input type="email" id="email" placeholder="Email" required autocomplete="email">
            <input type="password" id="password" placeholder="New password (min 8 characters)" required minlength="8" autocomplete="new-password">
            <input type="password" id="password2" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
            <button type="submit">Update password</button>
        </form>
        <div id="message" class="error"></div>
        <div class="register-link">
            <a href="/login">Back to login</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token') || '';
        const emailParam = params.get('email') || '';
        if (emailParam) document.getElementById('email').value = decodeURIComponent(emailParam);

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            if (password !== password2) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Passwords do not match';
                return;
            }
            if (!token) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Missing reset token. Use the link from your email.';
                return;
            }
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, token, password })
            });
            const data = await res.json();
            messageDiv.className = data.success ? 'success' : 'error';
            messageDiv.textContent = data.message || '';
            if (data.success) {
                setTimeout(() => { location.href = '/login'; }, 1200);
            }
        });
    </script>
    <script src="/js/site-media.js" defer></script>
</body>
</html>
