# Production-ish stack: Tribams origin + Postgres
# Cloudflare sits in front of this host (DNS proxy / Tunnel) — not inside this compose file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tribams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tribams_secret_change_me}
      POSTGRES_DB: tribams
    volumes:
      - tribams_pg:/var/lib/postgresql/data
    # Do not publish 5432 to the host/internet — web reaches db on the compose network only.
    # For local GUI access: temporarily add ports: ["127.0.0.1:5432:5432"]
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribams -d tribams"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3080}:3080"
    environment:
      NODE_ENV: production
      PORT: 3080
      SESSION_STORE: memory
      DATABASE_URL: postgres://tribams:${POSTGRES_PASSWORD:-tribams_secret_change_me}@db:5432/tribams
      DB_CLIENT: postgres
      PGSSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-https://tribams.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TLS_INSECURE: ${EMAIL_TLS_INSECURE:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      NAD_PER_USD: ${NAD_PER_USD:-18.5}
    volumes:
      - tribams_uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  tribams_pg:
  tribams_uploads:
